name: Refresh ccTLD data and visualisations

on:
  schedule:
    - cron: '0 2 * * 0'  # 2am UTC Sunday
  workflow_dispatch:       # allow manual trigger

jobs:
  gather:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cctld-protocol-data .

      - name: Generate data
        id: generate
        run: |
          FILENAME="results/latest_protocol_data.csv"
          docker run --rm -v $(pwd)/results:/app/results cctld-protocol-data \
            ruby generate_data.rb > results/latest_protocol_data.csv
          echo "csv_filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Commit data file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --staged --quiet || git commit -m "Data refresh $(date +%Y-%m-%d)"
          git push